name: Motion Controller CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-test-benchmark:
    name: Build, test, benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out pinned SOEM v2
        uses: actions/checkout@v7
        with:
          repository: OpenEtherCATsociety/SOEM
          ref: 304d1c05eab77dc0d426f1a5cf09c8cc7dc03713
          path: deps/SOEM

      - name: Check out pinned FreeRTOS Kernel V11.3.0
        uses: actions/checkout@v7
        with:
          repository: FreeRTOS/FreeRTOS-Kernel
          ref: 9b777ae5c5b8e9e456065a00294d1e5f5f9facf5
          path: deps/FreeRTOS-Kernel

      - name: Check local toolchain helper
        shell: pwsh
        run: ./scripts/check_toolchain.ps1 -RequireCMake -RequireCompiler

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure adapter-flag smoke build
        run: cmake -S . -B build-adapter-flags -DCMAKE_BUILD_TYPE=Release -DEMRTC_ENABLE_SOEM=ON -DEMRTC_ENABLE_SOCKETCAN=ON

      - name: Build and install pinned SOEM v2
        run: >
          cmake -S deps/SOEM -B deps/SOEM-build
          -DCMAKE_BUILD_TYPE=Release
          -DSOEM_BUILD_SAMPLES=OFF
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/deps/SOEM-install
          && cmake --build deps/SOEM-build --parallel 2
          && cmake --install deps/SOEM-build

      - name: Configure dependency-backed SOEM build
        run: >
          cmake -S . -B build-soem
          -DCMAKE_BUILD_TYPE=Release
          -DEMRTC_ENABLE_SOEM=ON
          -DEMRTC_REQUIRE_SOEM=ON
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/deps/SOEM-install

      - name: Configure FreeRTOS POSIX port build
        run: >
          cmake -S . -B build-freertos
          -DCMAKE_BUILD_TYPE=Release
          -DEMRTC_ENABLE_FREERTOS_PORT=ON
          -DEMRTC_REQUIRE_FREERTOS=ON
          -DEMRTC_FREERTOS_KERNEL_PATH=${{ github.workspace }}/deps/FreeRTOS-Kernel
          -DEMRTC_FREERTOS_PORT=GCC_POSIX

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Build adapter-flag smoke target
        run: cmake --build build-adapter-flags --config Release --target emrtc_tests --parallel 2

      - name: Build dependency-backed SOEM target
        run: cmake --build build-soem --config Release --target emrtc_tests --parallel 2

      - name: Build FreeRTOS port and smoke target
        run: cmake --build build-freertos --config Release --target emrtc_freertos_smoke --parallel 2

      - name: Run unit and integration tests
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Run dependency-backed SOEM guard tests
        run: ctest --test-dir build-soem --build-config Release --output-on-failure

      - name: Run FreeRTOS POSIX cyclic-task smoke test
        run: ctest --test-dir build-freertos --build-config Release --output-on-failure

      - name: Run simulator and export validation reports
        run: ./build/emrtc_sim --cycles 2500 --out reports/generated/ci-sim

      - name: Run JSON scenario loader
        run: ./build/emrtc_sim --scenario examples/scenarios/fault_matrix.json --out reports/generated/ci-scenario

      - name: Run two-axis coordinated simulation
        run: ./build/emrtc_cli run two-axis

      - name: Run deterministic benchmark
        run: ./build/emrtc_benchmark --cycles 10000 --out reports/generated/ci-benchmark

      - name: Run wall-clock host real-time probe
        run: ./build/emrtc_realtime_probe --cycles 500 --period-us 1000 --tolerance-us 100 --stress-threads 1 --out reports/generated/ci-realtime-probe

      - name: Run portfolio demo walkthrough
        shell: pwsh
        run: ./scripts/demo_portfolio.ps1 -BuildDir build -OutDir reports/generated/ci-demo

      - name: Install report generation dependencies
        run: python3 -m pip install reportlab

      - name: Generate sample report artifacts
        run: python3 scripts/generate_report.py --out reports/generated/ci-python

      - name: Generate deterministic timing PDF
        run: python3 scripts/generate_timing_pdf.py --metrics reports/sample_metrics.json --out reports/generated/ci-python/timing_report.pdf

      - name: Generate validation graphics
        run: python3 scripts/generate_graphs.py --metrics reports/sample_metrics.json --out reports/generated/ci-python

      - name: Generate capture profile manifest
        run: python3 scripts/generate_capture_manifest.py --profiles config/capture_profiles --out reports/generated/ci-python

      - name: Generate hardware target manifest
        run: python3 scripts/generate_hardware_target_manifest.py --targets config/hardware_targets --out reports/generated/ci-python

      - name: Generate recruiter one-pager
        run: python3 scripts/generate_one_pager.py --metrics reports/sample_metrics.json --manifest reports/sample_capture_manifest.json --out reports/generated/ci-python/recruiter_one_pager.md

      - name: Package portfolio evidence bundle
        shell: pwsh
        run: ./scripts/package_portfolio.ps1 -OutDir reports/generated/portfolio-bundle -ArchivePath reports/generated/portfolio-bundle.zip

      - name: Repository health checks
        run: python3 scripts/validate_project.py

      - name: Simulation-complete milestone gate
        run: python3 scripts/check_simulation_milestone.py

      - name: Evidence archive validator tests
        run: python3 tests/test_evidence_archive_validator.py -v

      - name: Upload generated reports
        uses: actions/upload-artifact@v7
        with:
          name: generated-validation-reports
          path: reports/generated/
